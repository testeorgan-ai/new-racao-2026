<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PetShop Express</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-3xl shadow-xl p-8 border border-slate-100">
    
    <div class="text-center mb-8">
      <div class="bg-amber-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-500">
        <i data-lucide="paw-print" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-800">PetAdmin</h1>
      <p class="text-slate-500 mt-2">Faça login para gerenciar a loja.</p>
    </div>

    <form id="form-login" class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">E-mail</label>
        <input type="email" id="email" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-400 outline-none transition" placeholder="admin@petshop.com">
      </div>
      
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">Senha</label>
        <input type="password" id="senha" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-400 outline-none transition" placeholder="••••••••">
      </div>

      <button type="submit" id="btn-entrar" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
        Entrar no Sistema <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div id="mensagem-erro" class="mt-4 text-center text-red-500 text-sm font-bold hidden"></div>

  </div>

  <script>
    lucide.createIcons();

    // 🔐 Configuração segura carregada de config.js
    if (typeof CONFIG === 'undefined') {
      alert('❌ Erro: arquivo config.js não encontrado!\nCopie config.example.js para config.js e preencha com seus dados.');
      throw new Error('CONFIG não definido');
    }
    const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btn-entrar');
      const erro = document.getElementById('mensagem-erro');
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('senha').value;

      btn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Conectando...';
      btn.disabled = true;
      erro.classList.add('hidden');
      lucide.createIcons();

      // Tenta fazer o Login
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        erro.innerText = "E-mail ou senha incorretos!";
        erro.classList.remove('hidden');
        btn.innerHTML = 'Entrar no Sistema <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        btn.disabled = false;
        lucide.createIcons();
      } else {
        // Se deu certo, redireciona para o painel!
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
